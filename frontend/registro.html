<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Xädi Hñähñu</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/frontend/js/tailwind-config.js" defer></script>
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif !important; 
            background-color: #fdf9f2 !important; 
        }
        .material-icons { 
            font-family: 'Material Icons' !important; 
            vertical-align: middle; 
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-8 bg-surface">

    <div class="max-w-md w-full bg-white p-10 rounded-[2.5rem] shadow-2xl border border-primary/10 relative overflow-hidden">
        
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-primary-container rounded-full blur-3xl opacity-50 pointer-events-none"></div>

        <div class="text-center mb-8 relative z-10">
            <div class="w-16 h-16 bg-secondary/10 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm border border-secondary/20">
                <span class="material-icons text-3xl text-secondary">person_add</span>
            </div>
            <h1 class="text-3xl font-extrabold text-on-surface tracking-tight">Únete a nosotros</h1>
            <p class="text-sm text-on-surface-variant mt-2 font-medium">Crea tu cuenta y empieza a aprender Hñähñu.</p>
        </div>

        <form id="registro-form" class="flex flex-col gap-5 relative z-10">
            
            <!-- Mensaje de Error Oculto -->
            <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl text-sm text-center font-bold"></div>
            
            <!-- Mensaje de Éxito Oculto -->
            <div id="success-message" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-xl text-sm text-center font-bold">
                ¡Cuenta creada con éxito! Redirigiendo...
            </div>

            <!-- Campo Nombre -->
            <div>
                <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2">Nombre Completo</label>
                <div class="relative">
                    <span class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">badge</span>
                    <input id="nombre" type="text" placeholder="Tu nombre" class="w-full pl-12 pr-4 py-3.5 bg-surface border border-primary/20 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all text-on-surface font-medium" required>
                </div>
            </div>

            <!-- Campo Correo -->
            <div>
                <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2">Correo Electrónico</label>
                <div class="relative">
                    <span class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">email</span>
                    <input id="email" type="email" placeholder="estudiante@ejemplo.com" class="w-full pl-12 pr-4 py-3.5 bg-surface border border-primary/20 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all text-on-surface font-medium" required>
                </div>
            </div>

            <!-- Campo Contraseña -->
            <div>
                <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2">Contraseña</label>
                <div class="relative">
                    <span class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">lock</span>
                    <input id="password" type="password" placeholder="Mínimo 6 caracteres" class="w-full pl-12 pr-4 py-3.5 bg-surface border border-primary/20 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all text-on-surface font-medium" minlength="6" required>
                </div>
            </div>

            <!-- Confirmar Contraseña -->
            <div>
                <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2">Confirmar Contraseña</label>
                <div class="relative">
                    <span class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">lock_check</span>
                    <input id="confirm-password" type="password" placeholder="Repite tu contraseña" class="w-full pl-12 pr-4 py-3.5 bg-surface border border-primary/20 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all text-on-surface font-medium" minlength="6" required>
                </div>
            </div>

            <button type="submit" class="w-full mt-4 py-4 bg-secondary text-white font-extrabold text-lg rounded-2xl shadow-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                <span>Crear Cuenta</span>
                <span class="material-icons text-sm">person_add</span>
            </button>
        </form>

        <div class="mt-8 text-center relative z-10">
            <p class="text-sm font-medium text-on-surface-variant">¿Ya tienes una cuenta? 
                <a href="/login" class="font-bold text-primary hover:brightness-110 transition-colors">Inicia sesión</a>
            </p>
        </div>
    </div>

    <script src="/frontend/js/registro.js?v=2"></script>
</body>
</html>
