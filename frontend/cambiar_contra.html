<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - Xädi Hñähñu</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/frontend/js/tailwind-config.js" defer></script>
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif !important; 
            background-color: #fdf9f2 !important; 
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-4 overflow-hidden">

    <div class="max-w-md w-full bg-white p-8 md:p-10 rounded-[2.5rem] shadow-xl border border-primary/10 text-center">
        
        <div class="w-16 h-16 mx-auto rounded-2xl bg-primary/10 text-primary flex items-center justify-center mb-6 shadow-sm">
            <span class="material-icons text-3xl">lock_reset</span>
        </div>

        <h2 class="text-3xl font-extrabold text-primary mb-2">Cambiar Contraseña</h2>
        <p class="text-xs text-on-surface-variant font-medium mb-8">Ingresa tu correo electrónico y define tu nueva contraseña de acceso.</p>

        <form id="form-cambiar" onsubmit="procesarCambio(event)" class="space-y-4 text-left">
            <div>
                <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2">Correo electrónico</label>
                <input type="email" id="email" required placeholder="tucorreo@ejemplo.com" 
                    class="w-full px-4 py-3 rounded-xl border border-outline-variant bg-surface/50 text-on-surface focus:outline-none focus:ring-2 focus:ring-primary font-medium text-sm transition-all">
            </div>

            <div>
                <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2">Nueva contraseña</label>
                <input type="password" id="nueva_password" required placeholder="••••••••" 
                    class="w-full px-4 py-3 rounded-xl border border-outline-variant bg-surface/50 text-on-surface focus:outline-none focus:ring-2 focus:ring-primary font-medium text-sm transition-all">
            </div>

            <p id="mensaje-error" class="text-xs font-bold text-error hidden text-center pt-1"></p>
            <p id="mensaje-exito" class="text-xs font-bold text-emerald-600 hidden text-center pt-1"></p>

            <button type="submit" class="w-full mt-2 py-3 px-4 rounded-xl bg-primary text-white font-bold shadow-md hover:brightness-110 transition-all flex items-center justify-center gap-2">
                <span class="material-icons text-sm">save</span> Guardar Nueva Contraseña
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-outline-variant/30 flex justify-between items-center text-xs font-bold">
            <a href="/login" class="text-primary hover:underline flex items-center gap-1">
                <span class="material-icons text-sm">arrow_back</span> Volver al Login
            </a>
        </div>
    </div>

    <script>
        async function procesarCambio(e) {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const nueva_password = document.getElementById("nueva_password").value.trim();
            const errorEl = document.getElementById("mensaje-error");
            const exitoEl = document.getElementById("mensaje-exito");

            errorEl.classList.add("hidden");
            exitoEl.classList.add("hidden");

            try {
                const response = await fetch("/api/cambiar-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, nueva_password })
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.detail || "Error al cambiar la contraseña");

                exitoEl.innerText = "¡Contraseña actualizada con éxito! Redirigiendo...";
                exitoEl.classList.remove("hidden");

                setTimeout(() => {
                    window.location.href = "/login";
                }, 2000);

            } catch (err) {
                errorEl.innerText = err.message;
                errorEl.classList.remove("hidden");
            }
        }
    </script>
</body>
</html>
