<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion - Xadi Hnahnu</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/frontend/js/tailwind-config.js" defer></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif !important;
            background-color: #fdf9f2 !important;
        }

        .material-icons {
            font-family: 'Material Icons' !important;
            vertical-align: middle;
        }
    </style>
</head>

<body class="h-screen flex items-center justify-center px-4 bg-surface">

    <div class="max-w-md w-full bg-white p-10 rounded-[2.5rem] shadow-2xl border border-primary/10 relative overflow-hidden">

        <div class="absolute -top-24 -right-24 w-48 h-48 bg-primary-container rounded-full blur-3xl opacity-50 pointer-events-none"></div>

        <div class="text-center mb-8 relative z-10">
            <div class="w-16 h-16 bg-primary/10 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm border border-primary/20">
                <span class="material-icons text-3xl text-primary">translate</span>
            </div>

            <h1 class="text-3xl font-extrabold text-on-surface tracking-tight">
                Inicio de Sesion
            </h1>

            <p class="text-sm text-on-surface-variant mt-2 font-medium">
                Ingresa a tu cuenta
            </p>
        </div>

        <form id="login-form" class="flex flex-col gap-5 relative z-10">

            <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl text-sm text-center font-bold">
                Correo o contrasena incorrectos.
            </div>

            <div>
                <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2">
                    Correo Electronico
                </label>

                <div class="relative">
                    <span class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">
                        email
                    </span>

                    <input
                        id="email"
                        type="email"
                        placeholder="estudiante@ejemplo.com"
                        class="w-full pl-12 pr-4 py-3.5 bg-surface border border-primary/20 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all text-on-surface font-medium"
                        required
                    >
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2">
                    Contrasena
                </label>

                <div class="relative">
                    <span class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">
                        lock
                    </span>

                    <input
                        id="password"
                        type="password"
                        placeholder="••••••••"
                        class="w-full pl-12 pr-4 py-3.5 bg-surface border border-primary/20 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all text-on-surface font-medium"
                        required
                    >
                </div>
            </div>

            <div class="flex items-center justify-between mt-2">
                 <label class="flex items-center gap-2 cursor-pointer group">
                    <input type="checkbox" id="recordarme" class="hidden peer">
                    <div class="w-4 h-4 rounded border border-primary/30 peer-checked:bg-primary peer-checked:border-primary flex items-center justify-center transition-colors">
                        <span class="material-icons text-white text-[12px] opacity-0 peer-checked:opacity-100">
                            check
                        </span>
                    </div>
                    <span class="text-sm font-medium text-on-surface-variant">
                        Recordarme
                    </span>
                </label>
                <a href="/cambiar-password" class="text-xs font-bold text-primary hover:underline">
                    ¿Olvidaste tu contraseña?
                </a>
            </div>

            <button
                type="submit"
                class="w-full mt-4 py-4 bg-primary text-white font-extrabold text-lg rounded-2xl shadow-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                <span>Iniciar Sesion</span>
                <span class="material-icons text-sm">arrow_forward</span>
            </button>

        </form>

        <div class="mt-8 text-center relative z-10">
            <p class="text-sm font-medium text-on-surface-variant">
                ¿Aun no tienes cuenta?
                <a href="/registro" class="font-bold text-secondary hover:brightness-110 transition-colors">
                    Registrate aqui
                </a>
            </p>
        </div>

    </div>

    <script src="/frontend/js/login.js?v=2"></script>
</body>
</html>
